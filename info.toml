mode = "run"
hint = '''
Compare with `==`. Arrays and strings compare by contents.
'''

[[exercises]]
name = "tests3"
dir = "tests"
mode = "run"
hint = '''
Write your own checks as functions; each runs the program's code under test.
'''

[[exercises]]
name = "tests4"
dir = "tests"
mode = "run"
hint = '''
`--debug` adds overflow and range checks that name the line. Without it signed overflow wraps.
'''

[[exercises]]
name = "lifetimes1"
dir = "lifetimes"
mode = "run"
hint = '''
A reference must not outlive the variable that owns its target. Declare `inner` in the same scope as `w`.
There are no lifetime annotations: the compiler infers every root.
'''

[[exercises]]
name = "lifetimes2"
dir = "lifetimes"
mode = "run"
hint = '''
A slice of a local dies with the function. Return the growable array itself: it is built in the caller's variable.
'''

[[exercises]]
name = "lifetimes3"
dir = "lifetimes"
mode = "run"
hint = '''
A struct that holds a slice has the root of whatever it points at. Store the text inline instead: `u8[..16]`.
'''

[[exercises]]
name = "lifetimes4"
dir = "lifetimes"
mode = "run"
hint = '''
A grow-only array cannot shrink while a reference into it is still used later. Use the reference first.
'''

[[exercises]]
name = "lifetimes5"
dir = "lifetimes"
mode = "run"
hint = '''
A reference into a grow-shrink array `[>..<]` is valid only until it shrinks. Keep an index instead.
'''

[[exercises]]
name = "iterators1"
dir = "iterators"
mode = "run"
hint = '''
`xs.map() { it * it }` builds a new array straight into its destination.
'''

[[exercises]]
name = "iterators2"
dir = "iterators"
mode = "run"
hint = '''
`filter` keeps the elements for which the block is true.
'''

[[exercises]]
name = "iterators3"
dir = "iterators"
mode = "run"
hint = '''
`fold(xs, init) { acc, x => ... }` threads an accumulator through the array.
'''

[[exercises]]
name = "iterators4"
dir = "iterators"
mode = "run"
hint = '''
`find() { cond }` returns the first match as an optional reference; `find_index` returns an index or -1.
'''

[[exercises]]
name = "iterators5"
dir = "iterators"
mode = "run"
hint = '''
`sum(xs)` adds from `default<T>()`; `min(xs)` and `max(xs)` assert the array is not empty.
'''

[[exercises]]
name = "iterators6"
dir = "iterators"
mode = "run"
hint = '''
`each_chunk(xs, n) { chunk, i => ... }` visits slices of n elements (the last may be shorter).
'''

[[exercises]]
name = "iterators7"
dir = "iterators"
mode = "run"
hint = '''
Walk two arrays together with the index form of `for`: `for x, i in a`.
'''

[[exercises]]
name = "iterators8"
dir = "iterators"
mode = "run"
hint = '''
A block may `return` from the *enclosing* function, not from the function calling the block.
'''

[[exercises]]
name = "iterators9"
dir = "iterators"
mode = "run"
hint = '''
Write your own higher-order function with a type parameter `F` and call it with `F(x)`.
'''

[[exercises]]
name = "references1"
dir = "references"
mode = "run"
hint = '''
Both parameters must be references (`i64&`) for the swap to reach the caller's variables.
'''

[[exercises]]
name = "references2"
dir = "references"
mode = "run"
hint = '''
`.==` asks whether two references are the *same* element; `==` compares the values.
'''

[[exercises]]
name = "references3"
dir = "references"
mode = "run"
hint = '''
A relative reference stores a narrow offset: `Node&<u32>?` is 4 bytes and uses 0 as null.
A link that can be empty must be optional: add the `?`.
'''

[[exercises]]
name = "references4"
dir = "references"
mode = "run"
hint = '''
`.=` on a field stores the offset to the pushed element, `=` would try to copy a Node into a link.
'''

[[exercises]]
name = "references5"
dir = "references"
mode = "run"
hint = '''
A `reusable` pool pairs an array with a hidden freelist: `free(i)` records a slot, `alloc_index` reuses it.
'''

[[exercises]]
name = "serialization1"
dir = "serialization"
mode = "run"
hint = '''
`a.to_bytes()` is a framed image of a whole array; `from_bytes<T>(image)` verifies it and returns the value and a bool.
'''

[[exercises]]
name = "serialization2"
dir = "serialization"
mode = "run"
hint = '''
`from_bytes` verifies every tag, length and link before the bytes become a value; hostile input is `false` and an empty array.
'''

[[exercises]]
name = "threads1"
dir = "threads"
mode = "build"
hint = '''
Threads need a real C compiler (`goose build`); gooslings does that for exercises marked mode = "build".
A thread_fn is declared with `thread_fn`, and started with thread_spawn(worker); wait for it with thread_wait(id).
'''

[[exercises]]
name = "threads2"
dir = "threads"
mode = "build"
hint = '''
Each worker needs its own quit message, so send one `-1` job per worker.
'''

[[exercises]]
name = "threads3"
dir = "threads"
mode = "build"
hint = '''
A global that a worker increments is the worker's own copy. Send the answer back through a queue instead.
'''

[[exercises]]
name = "threads4"
dir = "threads"
mode = "build"
hint = '''
`thread_spawn_contained` makes a worker whose failed asserts end only that worker; `thread_wait(id, msg)` returns false and gives the message.
'''

[[exercises]]
name = "conversions1"
dir = "conversions"
mode = "run"
hint = '''
A narrower integer widens into a wider one implicitly; the other direction needs `as`.
'''

[[exercises]]
name = "conversions2"
dir = "conversions"
mode = "run"
hint = '''
`u32 + i32` is a compile error: the language will not guess which you meant. Cast one of them.
'''

[[exercises]]
name = "conversions3"
dir = "conversions"
mode = "run"
hint = '''
Integers become floats implicitly, but a float becomes an integer only through `as`, truncating toward zero.
'''

[[exercises]]
name = "conversions4"
dir = "conversions"
mode = "run"
hint = '''
`format_int(out, v, base, width, pad)` for rendering and `parse_int(s, base)` for reading a different base.
'''

[[exercises]]
name = "conversions5"
dir = "conversions"
mode = "run"
hint = '''
`parse_flt` parses a float and, like `parse_int`, returns a validity flag.
'''

[[exercises]]
name = "bits1"
dir = "bits"
mode = "run"
hint = '''
`popcount(x)` counts set bits, `ctz` counts trailing zeros, `clz` leading zeros (64 for 0).
'''

[[exercises]]
name = "bits2"
dir = "bits"
mode = "run"
hint = '''
`<<` and `>>` shift; `&`, `|` and `^` combine; masks isolate bits.
'''

[[exercises]]
name = "bits3"
dir = "bits"
mode = "run"
hint = '''
Unsigned arithmetic wraps in every build, which is what hashes and PRNGs mean by unsigned math.
'''

[[exercises]]
name = "c_interop1"
dir = "c_interop"
mode = "run"
hint = '''
`extern fn name(args) -> ret;` binds a Goose signature to a C symbol; hypot comes from libm.
'''

[[exercises]]
name = "c_interop2"
dir = "c_interop"
mode = "run"
hint = '''
`extern "cbrt" fn cube_root(...)` binds the C symbol `cbrt` to the Goose name `cube_root`.
'''

[[exercises]]
name = "quiz2"
dir = "quiz"
mode = "run"
hint = '''

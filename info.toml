hint = '''
`split(s, ',')` gives an array of slices into s. `words(s)` splits at runs of whitespace.
'''

[[exercises]]
name = "strings5"
dir = "strings"
mode = "run"
hint = '''
`parse_int(s)` returns the number and a bool saying whether it was valid.
'''

[[exercises]]
name = "strings6"
dir = "strings"
mode = "run"
hint = '''
`format_int(out, v, base, width, pad)` right-aligns; `to_upper` works in place on ASCII.
'''

[[exercises]]
name = "strings7"
dir = "strings"
mode = "run"
hint = '''
`join(out, parts, sep)` appends the parts separated by sep.
'''

[[exercises]]
name = "strings8"
dir = "strings"
mode = "run"
hint = '''
Text that spans lines is a `"""` string. It is raw (no escapes), and the indentation of the closing `"""` is removed from every line.
'''

[[exercises]]
name = "strings9"
dir = "strings"
mode = "run"
hint = '''
`each_split(s, sep) { ... }` calls the block for each part; `it` is the implicit parameter.
'''

[[exercises]]
name = "strings10"
dir = "strings"
mode = "run"
hint = '''
`each_utf8(s) { ... }` gives code points; `push_utf8(out, cp)` appends one.
'''

[[exercises]]
name = "modules1"
dir = "modules"
mode = "run"
hint = '''
`import std;` loads the standard library module of that name. Imports create no namespace.
'''

[[exercises]]
name = "modules2"
dir = "modules"
mode = "run"
hint = '''
`namespace geo;` at the top of the file puts the declarations in `geo`. Use `geo::name` from outside.
`fn ::main()` declares main in the global namespace even inside a namespaced file.
'''

[[exercises]]
name = "modules3"
dir = "modules"
mode = "run"
hint = '''
Declarations from `dictionary` are in the global namespace once it is imported.
'''

[[exercises]]
name = "modules4"
dir = "modules"
mode = "run"
hint = '''
`fn main` is the entry point and it must be in the global namespace of the root file.
Inside a namespaced file, `fn ::main()` declares it globally.
'''


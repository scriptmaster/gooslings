'''

[[exercises]]
name = "quiz3"
dir = "quiz"
mode = "run"
hint = '''
Dictionary `update` plus `each_split` counts; sort the result array of structs to find the leader.
'''

[[exercises]]
name = "quiz4"
dir = "quiz"
mode = "run"

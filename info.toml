hint = '''
An optional must be narrowed before use: `if opt { ... }` makes it a plain reference inside.
'''

[[exercises]]
name = "options3"
dir = "options"
mode = "run"
hint = '''
`guard opt else { return ...; }` narrows for the rest of the block.
'''

[[exercises]]
name = "options4"
dir = "options"

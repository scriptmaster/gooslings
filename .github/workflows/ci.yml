name: CI
on:
  push:
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 gooslings.py install
      - name: Every solution passes, every exercise is unsolved
        run: |
          export PATH="$HOME/.gooslings/goose-v2026.3:$PATH"
          python3 gooslings.py selftest
